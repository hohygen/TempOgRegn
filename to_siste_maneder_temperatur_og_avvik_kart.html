const panel=L.control({position:"topright"});panel.onAdd=()=>{const e=L.DomUtil.create("div","panel");e.innerHTML=`<div>${datasett.map(d=>`<button id="maned-${d.id}">${d.navn}</button>`).join("")}</div><div><button id="temperatur">Temperatur</button><button id="temperaturavvik">Temperaturavvik</button><button id="nedbor">Nedbør</button><button id="nedboravvik">Nedbørprosent</button></div><div id="forklaring"></div><div id="generert"></div>`;L.DomEvent.disableClickPropagation(e);return e};panel.addTo(kart);document.querySelector("#generert").textContent=`Generert: ${"01.10.2026 kl. 14:52:36 UTC"}`;document.addEventListener("click",e=>{if(visninger[e.target.id]){modus=e.target.id;tegn()}else if(e.target.id.startsWith("maned-")){valgtManed=e.target.id.slice(6);tegn()}});const allePunkter=datasett.flatMap(d=>d.punkter);kart.fitBounds(allePunkter.map(p=>[p.lat,p.lon]),{padding:[25,25]});tegn();
